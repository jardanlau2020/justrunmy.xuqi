name: JustRunMy

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
      JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
      JUSTRUNMY_APP_URL: ${{ secrets.JUSTRUNMY_APP_URL }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      SCREENSHOT_DIR: screenshots
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: 运行续期脚本
        run: |
          mkdir -p screenshots
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"             python justrunmy_renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ github.run_id }}
          path: |
            screenshots/
          if-no-files-found: ignore
